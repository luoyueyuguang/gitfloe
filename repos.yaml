# gitfloe — auto-sync your forks to upstream via GitHub's merge-upstream API.
#
# Auto-enumerated from your PUBLIC forks, minus the ones that CONFLICT on merge.
# Removed (conflict): CAPEv2, Learning-CUDA, arxiv_rss_bot, llaisys.
# DELETE any others you don't want to sync. Private forks aren't listed.
#
#   - fork:      your fork, "owner/fork-repo"
#   - upstream:  reference only (the API uses the fork's GitHub parent).
#   - branch:    which branch merge-upstream merges into.
#   - handler:   plugin run on conflict/error (default: email).
#
# digest = overall summary emails. Disabled for now.
default:
  branch: main
  strategy: auto
  handler: email

digest:
  on_run: false
  on_interval: false

