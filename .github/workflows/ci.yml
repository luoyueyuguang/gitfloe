name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: uv sync --frozen
      - name: Compile check
        run: uv run python -m compileall -q gitfloe
      - name: Run tests
        run: uv run pytest -q
