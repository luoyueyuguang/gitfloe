[project]
name = "gitfloe"
version = "0.1.0"
description = "Keep GitHub forks in sync with upstreams via the merge-upstream API, with pluggable attention handlers"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "luoyueyuguang" }]
keywords = ["github", "fork", "sync", "merge-upstream"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = ["PyYAML>=6.0"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
gitfloe = "gitfloe.cli:main"

[project.urls]
Homepage = "https://github.com/luoyueyuguang/gitfloe"
Repository = "https://github.com/luoyueyuguang/gitfloe"
Issues = "https://github.com/luoyueyuguang/gitfloe/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gitfloe"]
